########################################################################################################################
# QUALITY CHECKS MATRIX WORKFLOW
# Runs multiple code quality checks in parallel for faster feedback
########################################################################################################################
name: Quality Checks

on:
  workflow_call:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: '${{ matrix.check.name }}'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.check.timeout || 10 }}
    continue-on-error: ${{ !matrix.check.blocking }}
    strategy:
      matrix:
        check:
          - name: 'Code Formatting (Prettier)'
            tool: prettier
            command: 'npm run format:check'
            blocking: true

          - name: 'Code Linting (ESLint)'
            tool: eslint
            command: 'npm run lint'
            blocking: true

          - name: 'Type Checking (TypeScript)'
            tool: typescript
            command: 'npm run typecheck'
            blocking: true

          - name: 'Unit Tests (Jest)'
            tool: jest
            command: 'npm test'
            blocking: true
            timeout: 15

          - name: 'Dead Code Detection (ts-prune)'
            tool: ts-prune
            command: 'npm run dead-code:check'
            warning: 'Unused exports found (not blocking - needs manual review)'
            blocking: false

          - name: 'Cyclomatic Complexity (ESLint)'
            tool: complexity
            command: 'npm run complexity:check'
            warning: 'High complexity detected (not blocking - consider refactoring)'
            blocking: false

          - name: 'JSDoc Coverage (eslint-plugin-jsdoc)'
            tool: jsdoc
            command: 'npm run jsdoc:check'
            warning: 'Missing or incomplete JSDoc comments (not blocking - documentation improvement needed)'
            blocking: false

      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.check.tool }}
        run: |
          echo "::group::Running ${{ matrix.check.tool }} check"
          set -o pipefail
          if [ "${{ matrix.check.blocking }}" = "true" ]; then
            # Blocking checks: fail if check fails
            ${{ matrix.check.command }} 2>&1 | tee ${{ matrix.check.tool }}.log
          else
            # Warn-only checks: show warning but don't fail
            ${{ matrix.check.command }} 2>&1 | tee ${{ matrix.check.tool }}.log || {
              echo "::warning::${{ matrix.check.warning }}"
              exit 0
            }
          fi
          echo "::endgroup::"

      - name: Upload check logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.check.tool }}-logs-${{ github.run_id }}
          path: ${{ matrix.check.tool }}.log
          retention-days: 7
