name: "CodeQL"

on:
  # CodeQL requires GitHub Advanced Security for private repositories
  # Enable these triggers when Advanced Security is enabled or repository is public
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Uncomment when Advanced Security is enabled:
  # push:
  #   branches: [ main ]
  # schedule:
  #   - cron: '0 6 * * 1,4'

permissions:
  actions: read
  contents: read
  security-events: write
  pull-requests: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Extended queries for comprehensive security analysis
        queries: security-extended,security-and-quality
        # Additional configuration
        config: |
          paths-ignore:
            - 'node_modules'
            - 'dist'
            - 'coverage'
            - '**/*.test.ts'
            - '**/*.spec.ts'

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
