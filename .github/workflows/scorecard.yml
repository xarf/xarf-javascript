name: OpenSSF Scorecard

on:
  # Run weekly on Monday at 10:00 UTC
  schedule:
    - cron: '0 10 * * 1'
  # Allow manual trigger
  workflow_dispatch:
  # Run on main branch pushes
  push:
    branches: [ main ]

# Restrict permissions for security
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to code-scanning dashboard
      security-events: write
      # Needed to publish results
      id-token: write
      # Needed for SARIF upload
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repository: enable publishing results to OpenSSF API
          # publish_results: true  # Enable only for public repos

      # Upload results to Security tab
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      # Upload results as artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
