version: 2

# Enable Dependabot version updates
# Security updates are always enabled separately via Dependabot security updates

updates:
  # npm dependencies - Production and Development
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"  # Check daily for faster security patches
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 15
    reviewers:
      - "xarf/maintainers"
    assignees:
      - "xarf/maintainers"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Rebase strategy for cleaner history
    rebase-strategy: "auto"
    # Group updates intelligently
    groups:
      # Group all patch updates for dev dependencies
      development-dependencies-patch:
        dependency-type: "development"
        update-types:
          - "patch"
      # Group minor updates for dev dependencies
      development-dependencies-minor:
        dependency-type: "development"
        update-types:
          - "minor"
      # Keep production patches separate for careful review
      # Major updates always separate for thorough review
    # Ignore specific packages if needed
    ignore:
      # Example: ignore major version updates for stable packages
      # - dependency-name: "typescript"
      #   update-types: ["version-update:semver-major"]
    # Enable version updates for all dependencies
    allow:
      - dependency-type: "all"
    # Increase pull request limit for security updates
    vulnerability-alerts:
      labels:
        - "security"
        - "dependencies"

  # GitHub Actions - Keep workflows secure and up-to-date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "xarf/maintainers"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    # Group minor and patch action updates
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
